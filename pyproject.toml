[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopward"
version = "0.1.0"
description = "Reliability layer for multi-agent LLM systems: anti-loop, human stop-gates, and per-run audit trails."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "lexosi" }]
keywords = [
    "agents",
    "anti-loop",
    "audit",
    "capability",
    "guardrails",
    "human-in-the-loop",
    "llm",
    "multi-agent",
    "reliability",
    "stop-gate",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Real LLM providers are optional; the `fake` provider needs nothing.
deepseek = ["openai>=1.40"]
claude = ["anthropic>=0.39"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "openai>=1.40",
    "anthropic>=0.39",
]

[project.scripts]
loopward = "loopward.cli:main"
loopward-demo = "loopward.demo:console"

[project.urls]
Homepage = "https://github.com/lexosi/loopward"
Repository = "https://github.com/lexosi/loopward"
Issues = "https://github.com/lexosi/loopward/issues"

[tool.setuptools.packages.find]
include = ["loopward*"]

[tool.setuptools.package-data]
loopward = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: fast, isolated unit tests",
    "integration: multi-component tests (still offline, fake provider)",
]
