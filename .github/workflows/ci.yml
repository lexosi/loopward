name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=loopward --cov-report=term-missing
      - name: Demo smoke (offline, no secrets)
        run: python demo/run_demo.py

  # Third-party installability proof: install straight from git on a clean
  # runner (no checkout, no editable, no dev extras) and run the offline demo.
  install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from git (clean, no secrets)
        run: pip install "git+https://github.com/${{ github.repository }}.git@${{ github.sha }}"
      - name: Import + console script smoke
        run: |
          python -c "from loopward import Orchestrator; print('import ok')"
          loopward-demo
